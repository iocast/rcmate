<!DOCTYPE html>
<html lang="{{ config.default_language }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }} · {{ config.extra.tagline }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#07080f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ config.title }}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:url" content="{{ config.base_url }}">
  <meta name="twitter:card" content="summary">
  <!-- Sets the theme before first paint to avoid a flash -->
  <script src="{{ get_url(path="js/theme-init.js") }}"></script>
  <link rel="icon" type="image/png" href="{{ get_url(path="logo.png") }}">
  <link rel="stylesheet" href="{{ get_url(path="css/main.css") }}">
</head>
<body data-repo="{{ config.extra.repo }}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a class="brand" href="{{ get_url(path="/") }}" aria-label="{{ config.title }} home">
        <img class="brand__mark brand__logo" src="{{ get_url(path="logo.png") }}" alt="" width="32" height="32">
        <span class="brand__name">{{ config.title }}</span>
      </a>

      <nav class="nav__links" id="nav-links" aria-label="Main">
        <a href="{{ get_url(path="/") }}#features">Features</a>
        <a href="{{ get_url(path="/") }}#config">Config</a>
        <a href="{{ get_url(path="/") }}#quickstart">Quick start</a>
        <a href="{{ get_url(path="@/docs/_index.md") }}">Docs</a>
        <a href="{{ config.extra.repo_url }}" target="_blank" rel="noopener">GitHub</a>
      </nav>

      <div class="nav__actions">
        <a class="nav__gh" href="{{ config.extra.repo_url }}" target="_blank" rel="noopener" aria-label="GitHub repository">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.6-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
          <span class="nav__stars" data-gh-stars>–</span>
        </a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav__burger" id="nav-burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock content %}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <span class="brand__name">{{ config.title }}</span>
        <p>{{ config.extra.tagline }}</p>
      </div>
      <nav class="footer__links" aria-label="Footer">
        <a href="{{ get_url(path="@/docs/_index.md") }}">Docs</a>
        <a href="{{ config.extra.repo_url }}" target="_blank" rel="noopener">Source</a>
        <a href="{{ config.extra.repo_url }}/issues" target="_blank" rel="noopener">Issues</a>
        <a href="{{ config.extra.repo_url }}/releases" target="_blank" rel="noopener">Releases</a>
        <a href="{{ config.extra.repo_url }}/blob/main/LICENSE-MIT" target="_blank" rel="noopener">License</a>
      </nav>
      <p class="footer__copy">© <span data-year></span> {{ config.extra.copyright }} · MIT / Apache-2.0 · Built with <a href="https://www.getzola.org" target="_blank" rel="noopener">Zola</a></p>
    </div>
  </footer>

  <script src="{{ get_url(path="js/main.js") }}" defer></script>
</body>
</html>
